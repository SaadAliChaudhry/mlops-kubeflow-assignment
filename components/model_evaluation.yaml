# PIPELINE DEFINITION
# Name: model-evaluation
# Inputs:
#    model: system.Model
#    test_data: system.Dataset
# Outputs:
#    metrics: system.Metrics
#    model-evaluation-metrics: system.Metrics
components:
  comp-model-evaluation:
    executorLabel: exec-model-evaluation
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-model-evaluation:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - model_evaluation
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.4.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'joblib' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef model_evaluation(test_data: Input[Dataset], model: Input[Model],\
          \ metrics: Output[Metrics]):\n    import pandas as pd\n    import joblib\n\
          \    from sklearn.metrics import mean_squared_error, r2_score\n\n    df\
          \ = pd.read_csv(test_data.path)\n    X_test = df.drop('PRICE', axis=1)\n\
          \    y_test = df['PRICE']\n\n    rf = joblib.load(model.path)\n    y_pred\
          \ = rf.predict(X_test)\n\n    mse = mean_squared_error(y_test, y_pred)\n\
          \    r2 = r2_score(y_test, y_pred)\n\n    metrics.log_metric(\"mse\", mse)\n\
          \    metrics.log_metric(\"r2\", r2)\n    print(f\"MSE: {mse}, R2: {r2}\"\
          )\n\n"
        image: python:3.7
pipelineInfo:
  name: model-evaluation
root:
  dag:
    outputs:
      artifacts:
        metrics:
          artifactSelectors:
          - outputArtifactKey: metrics
            producerSubtask: model-evaluation
        model-evaluation-metrics:
          artifactSelectors:
          - outputArtifactKey: metrics
            producerSubtask: model-evaluation
    tasks:
      model-evaluation:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-model-evaluation
        inputs:
          artifacts:
            model:
              componentInputArtifact: model
            test_data:
              componentInputArtifact: test_data
        taskInfo:
          name: model-evaluation
  inputDefinitions:
    artifacts:
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
      test_data:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
  outputDefinitions:
    artifacts:
      metrics:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
      model-evaluation-metrics:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.4.0
